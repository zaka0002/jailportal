<svg xmlns="http://www.w3.org/2000/svg" width="178" height="60" viewBox="0 0 178 60" role="img" aria-label="Get it on JailPortal">
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#1c1c21"/>
			<stop offset="1" stop-color="#0c0c0f"/>
		</linearGradient>
		<linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
			<stop offset="0.4" stop-color="#ffffff" stop-opacity="0.02"/>
			<stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
		</linearGradient>
		<linearGradient id="ring" gradientUnits="userSpaceOnUse" x1="18.5" y1="41.5" x2="41.5" y2="18.5">
			<stop offset="0" stop-color="#0064e0"/>
			<stop offset="1" stop-color="#00b2ff"/>
		</linearGradient>
		<filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
			<feGaussianBlur stdDeviation="7"/>
		</filter>
	</defs>
	<rect x="0.5" y="0.5" width="177" height="59" rx="13" fill="url(#bg)" stroke="#ffffff" stroke-opacity="0.09"/>
	<rect x="1.5" y="1.5" width="175" height="57" rx="12" fill="none" stroke="url(#edge)"/>
	<circle cx="30" cy="30" r="13" fill="#0064e0" opacity="0.3" filter="url(#glow)"/>
	<g transform="translate(14 14)">
		<rect x="4.5" y="4.5" width="23" height="23" rx="7" fill="none" stroke="url(#ring)" stroke-width="3.5"/><path d="M 11.5 10 V 22 M 16 10 V 22 M 20.5 22 V 17 Q 20.5 12.5 24.5 10.5" fill="none" stroke="url(#ring)" stroke-width="2.6" stroke-linecap="round"/>
	</g>
	<text x="56" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="600" letter-spacing="2.2" fill="#a1a1aa">GET IT ON</text>
	<text x="56" y="44.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" letter-spacing="-0.2"><tspan fill="#fafafa">Jail</tspan><tspan fill="#4da3ff">Portal</tspan></text>
